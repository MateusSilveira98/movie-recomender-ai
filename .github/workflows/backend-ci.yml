name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/bff/**'
      - 'packages/database/**'
      - 'packages/logger/**'
      - 'packages/ml/**'
      - 'packages/observability/**'
      - 'packages/recommender/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-cd.yml'
permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npx nx run-many -t typecheck --projects=bff,recommender,ml,database,logger,observability
      - run: npx nx run-many -t test --projects=bff,recommender,ml,logger,observability
      - run: npx nx run bff:build
