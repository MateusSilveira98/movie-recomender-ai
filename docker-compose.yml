services:
  database:
    image: ghcr.io/tursodatabase/libsql-server@sha256:528e068844b4bc5b87fb128da87e98d361d3414c4e1cced7b943939248e0ed2f
    platform: linux/amd64
    environment:
      SQLD_DB_PATH: ${SQLD_DB_PATH}
      SQLD_HTTP_LISTEN_ADDR: ${SQLD_HTTP_LISTEN_ADDR}
      SQLD_GRPC_LISTEN_ADDR: ${SQLD_GRPC_LISTEN_ADDR}
    ports:
      - "${SQLD_HTTP_HOST_PORT}:8080"
      - "${SQLD_GRPC_HOST_PORT}:8081"
    volumes:
      - database-data:${DATABASE_DATA_DIR}

  migrate:
    image: node:22.16.0-alpine
    working_dir: ${WORKSPACE_DIR}
    command: sh -lc "npm ci --no-audit && npm exec -- tsx --tsconfig tsconfig.base.json packages/database/src/apply-schema.ts"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:${WORKSPACE_DIR}
      - workspace-node-modules:${WORKSPACE_DIR}/node_modules
    depends_on:
      - database

  bff:
    image: node:22.16.0-alpine
    working_dir: ${WORKSPACE_DIR}
    command: npx tsx watch --tsconfig tsconfig.base.json apps/bff/src/main.ts
    environment:
      PORT: ${BFF_PORT}
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      UPLOAD_STORAGE_DIR: ${UPLOAD_STORAGE_DIR}
      WEB_ORIGIN: ${WEB_ORIGIN}
    ports:
      - "${BFF_HOST_PORT}:${BFF_PORT}"
    volumes:
      - .:${WORKSPACE_DIR}
      - workspace-node-modules:${WORKSPACE_DIR}/node_modules
      - upload-data:${UPLOAD_STORAGE_DIR}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  database-data:
  upload-data:
  workspace-node-modules:
