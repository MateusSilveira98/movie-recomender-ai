services:
  database:
    image: ghcr.io/tursodatabase/libsql-server@sha256:528e068844b4bc5b87fb128da87e98d361d3414c4e1cced7b943939248e0ed2f
    platform: linux/amd64
    environment:
      SQLD_DB_PATH: /var/lib/sqld/movie-recomender-ai.db
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_GRPC_LISTEN_ADDR: 0.0.0.0:8081
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - database-data:/var/lib/sqld

  migrate:
    image: node:22.16.0-alpine
    working_dir: /workspace
    command: sh -lc "npm ci --no-audit && npm exec -- tsx --tsconfig tsconfig.base.json packages/database/src/apply-schema.ts"
    environment:
      DATABASE_URL: http://database:8080
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules
    depends_on:
      - database

  bff:
    image: node:22.16.0-alpine
    working_dir: /workspace
    command: npm run dev:bff
    environment:
      PORT: 3333
      DATABASE_URL: http://database:8080
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3333:3333"
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: node:22.16.0-alpine
    working_dir: /workspace
    command: npx nx run recommender:import-dataset
    environment:
      APP_ENV: docker-local
      DATABASE_URL: http://database:8080
      MOVIES_DATASET_DIR: /dataset
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules
      - /Users/mateus.costa/Projects/IA/MoviesDataset:/dataset:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  database-data:
  workspace-node-modules:
