services:
  database:
    image: ghcr.io/tursodatabase/libsql-server@sha256:528e068844b4bc5b87fb128da87e98d361d3414c4e1cced7b943939248e0ed2f
    platform: linux/amd64
    environment:
      SQLD_DB_PATH: ${SQLD_DB_PATH}
      SQLD_HTTP_LISTEN_ADDR: ${SQLD_HTTP_LISTEN_ADDR}
      SQLD_GRPC_LISTEN_ADDR: ${SQLD_GRPC_LISTEN_ADDR}
    ports:
      - "${SQLD_HTTP_HOST_PORT}:8080"
      - "${SQLD_GRPC_HOST_PORT}:8081"
    volumes:
      - database-data:${DATABASE_DATA_DIR}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env.}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env.}
    ports:
      - "${MINIO_API_HOST_PORT:-127.0.0.1:19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-127.0.0.1:19001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        attempt=0
        until mc alias set local "http://minio:9000" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          attempt=$$((attempt + 1))

          if [ "$$attempt" -ge 30 ]; then
            echo "Não foi possível conectar ao MinIO local." >&2
            exit 1
          fi

          sleep 1
        done

        mc mb --ignore-existing "local/$${MODEL_STORAGE_BUCKET}"

        cat > /tmp/model-publisher-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:PutObject"],
            "Resource": ["arn:aws:s3:::$${MODEL_STORAGE_BUCKET}/$${MODEL_STORAGE_PREFIX}/*"]
          }]
        }
        EOF
        cat > /tmp/model-reader-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::$${MODEL_STORAGE_BUCKET}/$${MODEL_STORAGE_PREFIX}/*"]
          }]
        }
        EOF

        mc admin policy create local model-publisher /tmp/model-publisher-policy.json
        mc admin policy create local model-reader /tmp/model-reader-policy.json

        mc admin user add local "$${MODEL_PUBLISHER_ACCESS_KEY}" "$${MODEL_PUBLISHER_SECRET_KEY}"
        mc admin user add local "$${MODEL_READER_ACCESS_KEY}" "$${MODEL_READER_SECRET_KEY}"

        mc admin policy attach local model-publisher --user "$${MODEL_PUBLISHER_ACCESS_KEY}"
        mc admin policy attach local model-reader --user "$${MODEL_READER_ACCESS_KEY}"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env.}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env.}
      MODEL_PUBLISHER_ACCESS_KEY: ${MODEL_PUBLISHER_ACCESS_KEY:?Defina MODEL_PUBLISHER_ACCESS_KEY no .env.}
      MODEL_PUBLISHER_SECRET_KEY: ${MODEL_PUBLISHER_SECRET_KEY:?Defina MODEL_PUBLISHER_SECRET_KEY no .env.}
      MODEL_READER_ACCESS_KEY: ${MODEL_READER_ACCESS_KEY:?Defina MODEL_READER_ACCESS_KEY no .env.}
      MODEL_READER_SECRET_KEY: ${MODEL_READER_SECRET_KEY:?Defina MODEL_READER_SECRET_KEY no .env.}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET:?Defina MODEL_STORAGE_BUCKET no .env.}
      MODEL_STORAGE_PREFIX: ${MODEL_STORAGE_PREFIX:?Defina MODEL_STORAGE_PREFIX no .env.}
    depends_on:
      - minio

  migrate:
    image: node:22.16.0-alpine
    working_dir: ${WORKSPACE_DIR}
    command: sh -lc "npm ci --ignore-scripts --no-audit && npm exec -- tsx --tsconfig tsconfig.base.json packages/database/src/apply-schema.ts"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:${WORKSPACE_DIR}
      - workspace-node-modules:${WORKSPACE_DIR}/node_modules
    depends_on:
      - database

  bff:
    image: node:22.16.0-alpine
    working_dir: ${WORKSPACE_DIR}
    command: npx tsx watch --tsconfig tsconfig.base.json apps/bff/src/main.ts
    environment:
      PORT: ${BFF_PORT}
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      UPLOAD_STORAGE_DIR: ${UPLOAD_STORAGE_DIR}
      DATASET_IMPORT_ADMIN_TOKEN: ${DATASET_IMPORT_ADMIN_TOKEN}
      WEB_ORIGIN: ${WEB_ORIGIN}
      MODEL_STORAGE_ACCESS_KEY: ${MODEL_READER_ACCESS_KEY:-}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET:-}
      MODEL_STORAGE_ENDPOINT: ${MODEL_STORAGE_ENDPOINT:-}
      MODEL_STORAGE_FORCE_PATH_STYLE: ${MODEL_STORAGE_FORCE_PATH_STYLE:-}
      MODEL_STORAGE_PREFIX: ${MODEL_STORAGE_PREFIX:-}
      MODEL_STORAGE_REGION: ${MODEL_STORAGE_REGION:-}
      MODEL_STORAGE_SECRET_KEY: ${MODEL_READER_SECRET_KEY:-}
      MODEL_VERSION: ${MODEL_VERSION:-}
    ports:
      - "${BFF_HOST_PORT}:${BFF_PORT}"
    volumes:
      - .:${WORKSPACE_DIR}
      - workspace-node-modules:${WORKSPACE_DIR}/node_modules
      - upload-data:${UPLOAD_STORAGE_DIR}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    profiles:
      - maintenance
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$MODEL_VERSION" || {
          echo "MODEL_VERSION precisa ser definido para publicar o modelo." >&2
          exit 1
        }
        exec npm exec -- tsx --tsconfig tsconfig.base.json packages/ml/src/train.ts
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MODEL_STORAGE_ACCESS_KEY: ${MODEL_PUBLISHER_ACCESS_KEY:?Defina MODEL_PUBLISHER_ACCESS_KEY no .env.}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET}
      MODEL_STORAGE_ENDPOINT: ${MODEL_STORAGE_ENDPOINT}
      MODEL_STORAGE_FORCE_PATH_STYLE: ${MODEL_STORAGE_FORCE_PATH_STYLE}
      MODEL_STORAGE_PREFIX: ${MODEL_STORAGE_PREFIX}
      MODEL_STORAGE_REGION: ${MODEL_STORAGE_REGION}
      MODEL_STORAGE_SECRET_KEY: ${MODEL_PUBLISHER_SECRET_KEY:?Defina MODEL_PUBLISHER_SECRET_KEY no .env.}
      MODEL_VERSION: ${MODEL_VERSION:-}
      TRAINING_MODEL_DIR: /tmp/movie-recommender-model
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  database-data:
  minio-data:
  upload-data:
  workspace-node-modules:
